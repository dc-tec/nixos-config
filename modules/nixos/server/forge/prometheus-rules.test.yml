rule_files:
  - prometheus-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'node_md_degraded{device="md126",instance="forge",job="node"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: ForgeRaidDegraded
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              device: md126
              instance: forge
              job: node
            exp_annotations:
              summary: "RAID array md126 is degraded"
              description: "RAID array md126 has one or more degraded members."

  - interval: 1m
    input_series:
      - series: 'smartctl_device_smart_status{device="sda",instance="forge",job="smartctl"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: ForgeSmartStatusFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              device: sda
              instance: forge
              job: smartctl
            exp_annotations:
              summary: "SMART status failed for sda"
              description: "The drive reports a failed SMART health status."

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/md127",fstype="ext4",instance="forge",job="node",mountpoint="/"}'
        values: "15x15"
      - series: 'node_filesystem_size_bytes{device="/dev/md127",fstype="ext4",instance="forge",job="node",mountpoint="/"}'
        values: "100x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeRootSpaceWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              category: storage
              device: /dev/md127
              fstype: ext4
              instance: forge
              job: node
              mountpoint: /
            exp_annotations:
              summary: "Forge root filesystem is running low on space"
              description: "The root filesystem has less than 20 percent free space."
      - eval_time: 10m
        alertname: ForgeRootSpaceCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/md127",fstype="ext4",instance="forge",job="node",mountpoint="/"}'
        values: "5x10"
      - series: 'node_filesystem_size_bytes{device="/dev/md127",fstype="ext4",instance="forge",job="node",mountpoint="/"}'
        values: "100x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: ForgeRootSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              category: storage
              device: /dev/md127
              fstype: ext4
              instance: forge
              job: node
              mountpoint: /
            exp_annotations:
              summary: "Forge root filesystem is critically low on space"
              description: "The root filesystem has less than 10 percent free space."
      - eval_time: 5m
        alertname: ForgeRootSpaceWarning
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: forge_backup_backend_objects
        values: "850x35"
    alert_rule_test:
      - eval_time: 30m
        alertname: ForgeBackupObjectLimitWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              category: backup
            exp_annotations:
              summary: "Forge backup repository is approaching its object limit"
              description: "The Dedibackup repository contains at least 800 of the permitted 1000 objects."
      - eval_time: 30m
        alertname: ForgeBackupObjectLimitCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'forge_backup_last_success_timestamp_seconds{backup_job="state",instance="forge",job="node"}'
        values: "0x2250"
    alert_rule_test:
      - eval_time: 37h30m
        alertname: ForgeStateBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              category: backup
              backup_job: state
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge state backup is stale"
              description: "No successful state backup has been recorded within the last 36 hours."

  - interval: 1m
    input_series:
      - series: 'forge_nix_cache_http_up{instance="forge",job="node"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeNixCacheUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              category: cache
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge Nix cache is unavailable"
              description: "The public binary-cache metadata endpoint has been unreachable for ten minutes."

  - interval: 1m
    input_series:
      - series: 'forge_nix_cache_signing_key_present{instance="forge",job="node"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeNixCacheSigningKeyMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              category: cache
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge Nix cache signing key is missing"
              description: "The private cache signing key has not been provisioned on forge."

  - interval: 1m
    input_series:
      - series: 'up{instance="forge",job="node"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: ForgeExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              category: availability
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge node exporter is unavailable"
              description: "Prometheus has been unable to scrape the node exporter for five minutes."

  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{instance="forge",job="node",name="grafana.service",state="failed"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: ForgeServiceFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              category: availability
              instance: forge
              job: node
              name: grafana.service
              state: failed
            exp_annotations:
              summary: "Forge service grafana.service failed"
              description: "The systemd unit grafana.service has remained in the failed state for five minutes."

  - interval: 1m
    input_series:
      - series: 'node_filesystem_files_free{device="/dev/md127",fstype="ext4",instance="forge",job="node",mountpoint="/"}'
        values: "5x15"
      - series: 'node_filesystem_files{device="/dev/md127",fstype="ext4",instance="forge",job="node",mountpoint="/"}'
        values: "100x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeRootInodesLow
        exp_alerts:
          - exp_labels:
              severity: warning
              category: storage
              device: /dev/md127
              fstype: ext4
              instance: forge
              job: node
              mountpoint: /
            exp_annotations:
              summary: "Forge root filesystem is running low on inodes"
              description: "The root filesystem has less than 10 percent free inodes."

  - interval: 1m
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeCacheFilesystemMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              category: storage
              instance: forge
              mountpoint: /cache
            exp_annotations:
              summary: "Forge cache filesystem is not mounted"
              description: "The reconstructible /cache filesystem has been absent from node exporter metrics for ten minutes."

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/sdc1",fstype="ext4",instance="forge",job="node",mountpoint="/cache"}'
        values: "10x15"
      - series: 'node_filesystem_size_bytes{device="/dev/sdc1",fstype="ext4",instance="forge",job="node",mountpoint="/cache"}'
        values: "100x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeCacheSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              category: storage
              device: /dev/sdc1
              fstype: ext4
              instance: forge
              job: node
              mountpoint: /cache
            exp_annotations:
              summary: "Forge cache filesystem is running low on space"
              description: "The reconstructible /cache filesystem has less than 15 percent free space."

  - interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill{instance="forge",job="node"}'
        values: "0x5 1x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: ForgeOomKillDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              category: memory
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge killed a process because of memory pressure"
              description: "The kernel recorded at least one OOM kill in the last 15 minutes."

  - interval: 1m
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeNixCacheMetricsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              category: cache
            exp_annotations:
              summary: "Forge Nix cache metrics are stale"
              description: "No successful cache metrics scan has been recorded within the last 15 minutes."

  - interval: 1m
    input_series:
      - series: 'forge_radicle_identity_present{instance="forge",job="node"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeRadicleIdentityMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              category: radicle
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge Radicle node identity is missing"
              description: "The dedicated Radicle node private key has not been provisioned on Forge."

  - interval: 1m
    input_series:
      - series: 'forge_radicle_identity_present{instance="forge",job="node"}'
        values: "1x15"
      - series: 'forge_radicle_node_active{instance="forge",job="node"}'
        values: "0x15"
      - series: 'forge_radicle_tcp_listening{instance="forge",job="node"}'
        values: "0x15"
      - series: 'forge_radicle_control_ready{instance="forge",job="node"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeRadicleNodeUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              category: radicle
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge Radicle node is unavailable"
              description: "The Radicle identity is present, but the node service, protocol listener, or administrative interface is unavailable."

  - interval: 1m
    input_series:
      - series: 'forge_radicle_repository_present{instance="forge",job="node",rid="rad:z4FGmdE1XLWBUPTNBe4cJUQvJ5WyX"}'
        values: "1x15"
      - series: 'forge_radicle_seed_policy_applied{instance="forge",job="node",rid="rad:z4FGmdE1XLWBUPTNBe4cJUQvJ5WyX"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeRadicleRepositoryUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              category: radicle
              instance: forge
              job: node
              rid: rad:z4FGmdE1XLWBUPTNBe4cJUQvJ5WyX
            exp_annotations:
              summary: "Forge is not replicating declared Radicle repository rad:z4FGmdE1XLWBUPTNBe4cJUQvJ5WyX"
              description: "The repository is absent, has an invalid identity, or no longer uses the declared followed seeding policy."

  - interval: 1m
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeRadicleMetricsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              category: radicle
            exp_annotations:
              summary: "Forge Radicle metrics are stale"
              description: "No successful Radicle metrics scan has been recorded within the last 15 minutes."

  - interval: 1m
    alert_rule_test:
      - eval_time: 30m
        alertname: ForgeBackupMaintenanceStale
        exp_alerts:
          - exp_labels:
              severity: warning
              category: backup
              backup_job: maintenance
            exp_annotations:
              summary: "Forge backup maintenance is stale"
              description: "No successful repository maintenance has been recorded within the last eight days."

  - interval: 1m
    alert_rule_test:
      - eval_time: 30m
        alertname: ForgeBackupInventoryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              category: backup
            exp_annotations:
              summary: "Forge backup inventory is stale"
              description: "No successful Dedibackup inventory has been recorded within the last 48 hours."

  - interval: 1m
    input_series:
      - series: forge_backup_backend_objects
        values: "950x35"
    alert_rule_test:
      - eval_time: 30m
        alertname: ForgeBackupObjectLimitCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              category: backup
            exp_annotations:
              summary: "Forge backup repository is close to its object limit"
              description: "The Dedibackup repository contains at least 900 of the permitted 1000 objects."
      - eval_time: 30m
        alertname: ForgeBackupObjectLimitWarning
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'forge_tangled_knot_database_present{instance="forge",job="node"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeTangledKnotDatabaseMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              category: tangled
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge Tangled Knot database is missing"
              description: "The Knot SQLite database has not been created or is no longer present."

  - interval: 1m
    input_series:
      - series: 'forge_tangled_knot_database_present{instance="forge",job="node"}'
        values: "1x15"
      - series: 'forge_tangled_knot_service_active{instance="forge",job="node"}'
        values: "1x15"
      - series: 'forge_tangled_knot_http_listener_ready{instance="forge",job="node"}'
        values: "1x15"
      - series: 'forge_tangled_knot_internal_listener_ready{instance="forge",job="node"}'
        values: "1x15"
      - series: 'forge_tangled_knot_public_http_ready{instance="forge",job="node"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeTangledKnotUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              category: tangled
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge Tangled Knot is unavailable"
              description: "The Knot has state, but its service, local listeners, or public TLS endpoint is unavailable."

  - interval: 1m
    input_series:
      - series: 'forge_tangled_knot_owner_matches{instance="forge",job="node"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeTangledKnotOwnerMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
              category: tangled
              instance: forge
              job: node
            exp_annotations:
              summary: "Forge Tangled Knot owner does not match"
              description: "The public Knot owner endpoint does not return the configured operator DID."

  - interval: 1m
    alert_rule_test:
      - eval_time: 10m
        alertname: ForgeTangledKnotMetricsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              category: tangled
            exp_annotations:
              summary: "Forge Tangled Knot metrics are stale"
              description: "No successful Tangled Knot metrics scan has been recorded within the last 15 minutes."
