[project]
name = "nixos-config"
revision = "1.0"

[providers]
keychain = "keyring://"

[profiles.default]
FORGE_RESTIC_PASSWORD = { description = "Encryption password for the forge Restic repository", providers = ["keychain"], type = "password", generate = true }

[scopes.forge-backup]
secrets = ["FORGE_RESTIC_PASSWORD"]
